<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/Icon32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/Icon192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/Icon180.png">
    <title>Conversaciones — Intranet Mardique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="/css/panel-nav.css">
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <style>
        :root{--pd:#1b4562;--pb:#28648c;--ag:#f09a36;--ac:#00a3e0;--bg:#f0f4f8;--sur:#fff;--bdr:#e2e8f2;--tx:#1e293b;--mx:#64748b;}
        *{box-sizing:border-box;}
        body{margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);}
        .phero{background:linear-gradient(155deg,#0d2438 0%,var(--pd) 55%,#0d2438 100%);padding:0 32px;position:relative;overflow:hidden;}
        .phw-glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.35;width:520px;height:520px;background:radial-gradient(circle,rgba(0,163,224,.32),transparent 70%);top:-180px;right:-140px;}
        .phw-container{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:92px 0 52px;}
        .phero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;}
        .phero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(240,154,54,.14);border:1px solid rgba(240,154,54,.3);color:var(--ag);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:5px 14px;border-radius:50px;margin-bottom:20px;animation:fadeInDown .6s ease both;}
        .phero h1{font-size:36px;font-weight:800;color:#fff;line-height:1.18;margin-bottom:14px;letter-spacing:-.5px;animation:fadeInUp .7s ease .1s both;}
        .phero p{font-size:15px;color:rgba(255,255,255,.62);margin-bottom:28px;max-width:420px;line-height:1.65;animation:fadeInUp .7s ease .25s both;}
        .phero-floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
        .phero-floaters i{position:absolute;color:rgba(255,255,255,.08);animation:floatIcon 9s ease-in-out infinite}
        .phero-floaters i:nth-child(1){font-size:60px;top:14%;left:6%}
        .phero-floaters i:nth-child(2){font-size:40px;top:62%;left:14%;animation-delay:1.4s}
        .phero-floaters i:nth-child(3){font-size:48px;top:20%;right:8%;animation-delay:.7s}
        .phero-floaters i:nth-child(4){font-size:36px;bottom:12%;right:16%;animation-delay:2.1s}
        .phw-wave{position:relative;z-index:1;line-height:0;margin:44px -32px 0;}
        .phw-wave svg{display:block;width:100%;height:56px;}
        @keyframes fadeInDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        @keyframes floatIcon{0%,100%{transform:translateY(0)}25%{transform:translateY(-12px)}75%{transform:translateY(-8px)}}
        @keyframes slideIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .phero-badge{animation:fadeInDown .6s ease both}
        .phero-main h1{animation:fadeInUp .7s ease .1s both}
        .phero-main p{animation:fadeInUp .7s ease .25s both}
        .phero-floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
        .phero-floaters i{position:absolute;color:rgba(255,255,255,.08);animation:floatIcon 9s ease-in-out infinite}
        .phero-floaters i:nth-child(1){font-size:60px;top:14%;left:6%;animation-delay:0s}
        .phero-floaters i:nth-child(2){font-size:40px;top:62%;left:14%;animation-delay:1.4s}
        .phero-floaters i:nth-child(3){font-size:48px;top:20%;right:8%;animation-delay:.7s}
        .phero-floaters i:nth-child(4){font-size:36px;bottom:12%;right:16%;animation-delay:2.1s}
        .intranet-shell{max-width:900px;margin:0 auto;padding:0 24px 90px;display:flex;flex-direction:column;gap:22px;}
        .intranet-main{flex:1;min-width:0;}
        body .section-header{margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #eef1f4;}
        body .section-header h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:var(--pd);margin:0;letter-spacing:-.2px;}
        body .section-header h2 i{color:var(--ag);font-size:17px;width:34px;height:34px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(240,154,54,.12);border-radius:9px;}
        body .section-header p{margin-top:6px!important;}
        body .tab-content{background:#fff;border:1px solid var(--bdr);border-radius:16px;padding:34px 36px;box-shadow:0 4px 22px rgba(15,42,58,.06);opacity:0;transform:translateY(20px);transition:all .55s cubic-bezier(.22,1,.36,1);}
        body .tab-content.visible{opacity:1;transform:translateY(0);}
        @media(max-width:700px){ body .tab-content{padding:22px 18px;} }
        .conv-banners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border-radius: 14px; overflow: hidden; margin-bottom: 28px; box-shadow: 0 8px 26px rgba(15,42,58,.1); }
        .conv-banner { position: relative; height: 220px; overflow: hidden; }
        .conv-banner img { width: 100%; height: 100%; object-fit: cover; }
        .conv-banner-label { position: absolute; left: 0; bottom: 0; right: 0; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,.65)); color: #fff; font-size: 16px; font-weight: 700; }
        @media(max-width: 700px){ .conv-banners{ grid-template-columns: 1fr; } }
        .conv-composer { background: #fff; border: 1px solid var(--bdr); border-radius: 14px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(15,42,58,.04); transition: border-color .2s; }
        .conv-composer:focus-within { border-color: var(--ag); box-shadow: 0 2px 16px rgba(240,154,54,.1); }
        .conv-composer-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .conv-composer-top input { flex: 1; border: 1.5px solid var(--bdr); border-radius: 12px; padding: 11px 16px; font-size: 13px; font-family: inherit; background: #fafbfc; transition: border-color .2s; }
        .conv-composer-top input:focus { outline: none; border-color: var(--ag); background: #fff; }
        .conv-composer-top input::placeholder { color: var(--mx); }
        .conv-composer-types { display: flex; gap: 8px; flex-wrap: wrap; }
        .conv-type-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: 11.5px; font-weight: 700; border: 1.5px solid transparent; cursor: pointer; font-family: inherit; background: rgba(27,69,98,.04); color: var(--mx); transition: all .2s; letter-spacing: .2px; }
        .conv-type-btn:hover { background: rgba(240,154,54,.06); color: var(--tx); border-color: rgba(240,154,54,.2); }
        .conv-type-btn.active { background: linear-gradient(135deg, var(--ag), #d4930d); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(240,154,54,.25); }
        .conv-post { background: #fff; border: 1px solid var(--bdr); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.03); transition: all .2s; animation: slideIn .4s ease both; }
        .conv-post:hover { box-shadow: 0 4px 18px rgba(15,42,58,.08); border-color: rgba(240,154,54,.2); }
        .conv-post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .conv-post-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--pd), var(--pb)); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .conv-post-head strong { font-size: 13px; color: var(--tx); display: block; }
        .conv-post-head span { font-size: 11px; color: var(--mx); }
        .conv-post-text { font-size: 13.5px; color: var(--tx); line-height: 1.6; margin-bottom: 12px; }
        .conv-post-actions { display: flex; gap: 20px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .conv-post-actions button { background: none; border: none; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--mx); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: color .2s; }
        .conv-post-actions button:hover { color: var(--ag); }
        .conv-post-empty { text-align: center; padding: 24px; color: var(--mx); font-size: 12.5px; }
        .mock-mode-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 14px; border-radius: 50px; font-size: 11px; font-weight: 700; background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; margin-left: 10px; }
        .user-greeting{font-size:15px;color:rgba(255,255,255,.75);margin-top:4px;}
        .user-badge{display:inline-block;padding:3px 12px;border-radius:50px;font-size:11px;font-weight:700;background:rgba(240,154,54,.14);color:var(--ag);border:1px solid rgba(240,154,54,.3);margin-top:8px;}
        @media(max-width:768px){ .header-user-name{display:none;} }
        .pfooter{text-align:center;padding:22px 28px;border-top:1px solid var(--bdr);color:var(--mx);font-size:12px;margin-top:auto;background:var(--bg);position:relative;}
        .pfooter::before{content:'';position:absolute;top:0;left:15%;width:70%;height:2px;background:linear-gradient(90deg,transparent,var(--ag),transparent);opacity:.35;}
    </style>
</head>
<body>

<div th:replace="~{IntranetNav :: nav(current='conversaciones')}"></div>

<div class="phero">
    <div class="phw-glow"></div>
    <div class="phero-floaters">
        <i class="fas fa-anchor"></i>
        <i class="fas fa-ship"></i>
        <i class="fas fa-water"></i>
        <i class="fas fa-crane"></i>
    </div>
    <div class="phw-container">
        <div class="phero-grid">
            <div class="phero-main">
                <div class="phero-badge"><i class="fas fa-comments"></i> Foro Colaborativo</div>
                <h1>Conversaciones</h1>
                <p>Espacio de comunicación interna y foros colaborativos</p>
            </div>
        </div>
    </div>
    <div class="phw-wave">
        <svg viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0,32 C240,60 480,4 720,20 C960,36 1200,58 1440,28 L1440,60 L0,60 Z" fill="#f0f4f8"/></svg>
    </div>
</div>

<div class="intranet-shell">
    <div class="intranet-main">
        <div class="tab-content reveal">
            <div class="conv-banners">
                <div class="conv-banner"><img src="https://images.unsplash.com/photo-1605281317010-fe5ffe798166?w=700&q=80" alt="Nuevos proyectos"><div class="conv-banner-label">Nuevos proyectos en Mardique</div></div>
                <div class="conv-banner"><img src="https://images.unsplash.com/photo-1494412651409-8963ce7935a7?w=700&q=80" alt="Operación de Maíz"><div class="conv-banner-label">Operación de Maíz</div></div>
            </div>

            <div class="conv-composer">
                <div class="conv-composer-top">
                    <div class="conv-post-avatar" id="conv-my-avatar" style="width:40px;height:40px;font-size:13px;">JG</div>
                    <input class="conv-composer-input" type="text" id="conv-input" placeholder="Compartir ideas o actualizaciones..." style="flex:1;border:1.5px solid var(--bdr);border-radius:12px;padding:11px 16px;font-size:13px;font-family:inherit;color:var(--tx);background:#fafbfc;transition:border-color .2s;">
                </div>
                <div class="conv-composer-types">
                    <button class="conv-type-btn active" data-type="Discusión"><i class="fas fa-comment-dots"></i> Discusión</button>
                    <button class="conv-type-btn" data-type="Pregunta"><i class="fas fa-circle-question"></i> Pregunta</button>
                    <button class="conv-type-btn" data-type="Elogio"><i class="fas fa-award"></i> Elogio</button>
                    <button class="conv-type-btn" data-type="Sondeo"><i class="fas fa-square-poll-vertical"></i> Sondeo</button>
                    <button style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--pd),#0d2438);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-left:auto;letter-spacing:.3px;" onclick="publishConversation()"><i class="fas fa-paper-plane"></i> Publicar</button>
                </div>
            </div>

            <div id="conversations-container"></div>
        </div>
    </div>
</div>

<div class="pfooter">
    &copy; 2026 Sociedad Portuaria Mardique S.A. Intranet Corporativa &mdash; Todos los derechos reservados.
</div>

<script src="/js/msal-config.js"></script>
<script src="/js/api-service.js"></script>
<script src="/js/intranet.js"></script>
<script>
let activeConversationType = "Discusión";

function initials(name){
    return name.split(" ").filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();
}

function renderConversations(items){
    const cont = document.getElementById("conversations-container");
    if (!cont) return;
    if (!items || !items.length) {
        cont.innerHTML = `<div class="conv-post-empty"><i class="fas fa-comments" style="font-size:28px;opacity:.4;margin-bottom:10px;display:block;"></i><strong>¡Fantástico!</strong><br>Buen trabajo para iniciar la conversación.</div>`;
        return;
    }
    cont.innerHTML = items.map(p => `
    <div class="conv-post">
        <div class="conv-post-head">
            <div class="conv-post-avatar">${initials(p.author)}</div>
            <div><strong>${escapeHtml(p.author)}</strong><span>${escapeHtml(p.time || '')}</span></div>
        </div>
        <div class="conv-post-text">${escapeHtml(p.text)}</div>
        <div class="conv-post-actions">
            <button><i class="fas fa-thumbs-up"></i> Me gusta ${p.likes ? '(' + p.likes + ')' : ''}</button>
            <button><i class="fas fa-comment"></i> Comentar ${p.comments ? '(' + p.comments + ')' : ''}</button>
        </div>
    </div>`).join("");
}

async function publishConversation(){
    const input = document.getElementById("conv-input");
    const text = input.value.trim();
    if (!text) return;
    const name = document.getElementById("userName") ? document.getElementById("userName").textContent : "Empleado";
    try {
        await submitConversation({ author: name, text, type: activeConversationType });
        input.value = "";
        loadConversations();
        showIntranetToast("Mensaje publicado correctamente", "success");
    } catch (err) {
        showIntranetError("Error al publicar: " + err.message);
    }
}

function loadConversations(){
    const cont = document.getElementById("conversations-container");
    if (!cont) return;
    cont.innerHTML = '<div class="conv-post-empty"><i class="fas fa-spinner fa-spin" style="font-size:20px;margin-bottom:8px;display:block;"></i>Cargando conversaciones...</div>';
    getConversations().then(items => {
        const mapped = items.map(item => {
            const f = item.fields || item;
            const createdAt = f.createdAt || f.Created;
            let timeStr = "recientemente";
            if (createdAt) {
                const diff = Date.now() - new Date(createdAt).getTime();
                const mins = Math.floor(diff / 60000);
                if (mins < 1) timeStr = "justo ahora";
                else if (mins < 60) timeStr = "hace " + mins + " min";
                else { const hrs = Math.floor(mins / 60); if (hrs < 24) timeStr = "hace " + hrs + " h"; else timeStr = "hace " + Math.floor(hrs / 24) + " d"; }
            }
            return {
                id: f.id,
                author: f.authorName || f.AuthorName || f.author || "Empleado",
                time: timeStr,
                text: f.text || f.Message || f.Title || "",
                likes: f.likes || 0,
                comments: f.comments || 0,
                type: f.type || f.Type || "Discusión"
            };
        });
        renderConversations(mapped);
    }).catch(err => {
        cont.innerHTML = '<div class="conv-post-empty"><i class="fas fa-exclamation-triangle" style="font-size:20px;color:#dc2626;margin-bottom:8px;display:block;"></i>Error al cargar: ' + escapeHtml(err.message || '') + '</div>';
    });
}

document.addEventListener("DOMContentLoaded", function() {
    if (!isMsalAuthenticated()) { window.location.href = "/login"; return; }
    if (isMockMode()) { const mb = document.getElementById("mockBadge"); if (mb) mb.style.display = "inline-flex"; }

    getCurrentUser().then(user => {
        const name = user.displayName || user.userPrincipalName || "Empleado";
        document.getElementById("userDisplay").textContent = name;
        const userNameEl = document.getElementById("userName"); if (userNameEl) userNameEl.textContent = name;
        if (user.jobTitle) document.getElementById("userBadge").textContent = user.jobTitle;
        const convAvatar = document.getElementById("conv-my-avatar");
        if (convAvatar) convAvatar.textContent = initials(name);
    }).catch(() => {});

    loadConversations();

    document.querySelectorAll(".conv-type-btn").forEach(btn => {
        btn.addEventListener("click", function(){
            document.querySelectorAll(".conv-type-btn").forEach(b => b.classList.remove("active"));
            this.classList.add("active");
            activeConversationType = this.dataset.type;
        });
    });

    document.getElementById("conv-input")?.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); publishConversation(); }
    });

    const hdr = document.getElementById('intranet-header');
    window.addEventListener('scroll', () => hdr?.classList.toggle('scrolled', window.scrollY > 60), { passive: true });

    const revealObs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));
});
</script>
</body>
</html>
