spring.application.name=MardiqueWeb

server.port=${PORT:8080}

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
app.encryption.key=${ENCRYPTION_KEY:changeme_in_production}

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

intranet.upload-dir=${INTRANET_UPLOAD_DIR:uploads/intranet}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

groq.api-key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.model-fallback=${GROQ_MODEL_FALLBACK:openai/gpt-oss-20b}